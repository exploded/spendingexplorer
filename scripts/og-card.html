<!doctype html>
<!-- Share card for og:image (web/static/og.png). Update the figures when a new Budget lands, then from the repo root:
     chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 --allow-file-access-from-files --window-size=1200,630 --virtual-time-budget=3000 --screenshot=web/static/og.png scripts/og-card.html -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Source Serif 4"; src: url("../web/static/fonts/source-serif-4-v5-latin-wght.woff2") format("woff2"); font-weight: 200 900; }
@font-face { font-family: "IBM Plex Sans"; src: url("../web/static/fonts/ibm-plex-sans-v5-latin-400.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "IBM Plex Sans"; src: url("../web/static/fonts/ibm-plex-sans-v5-latin-600.woff2") format("woff2"); font-weight: 600; }
:root { --bg:#f7f6f2; --ink:#17181b; --ink-2:#474a50; --ink-3:#6a6c72; --rule:#e1dfd8; --meter:#1d4f8f; --tile-bg:#ecebe5; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans", sans-serif; }
.card { position: absolute; inset: 0; padding: 64px 64px 56px; display: grid; grid-template-columns: 470px 1fr; grid-template-rows: 510px; gap: 48px; }
.left { display: flex; flex-direction: column; }
.kicker { font: 600 17px/1.4 "IBM Plex Sans"; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3); }
h1 { font: 600 64px/1.04 "Source Serif 4"; letter-spacing: -0.01em; margin-top: 18px; }
.lede { font-size: 25px; line-height: 1.4; color: var(--ink-2); margin-top: 26px; }
.lede b { font: 600 27px/1 "Source Serif 4"; color: var(--ink); }
.url { margin-top: auto; padding-top: 18px; border-top: 2px solid var(--ink); font: 600 24px/1 "IBM Plex Sans"; display: flex; justify-content: space-between; align-items: baseline; }
.url span { font-weight: 400; font-size: 18px; color: var(--ink-3); }
.tm { position: relative; }
.tile { position: absolute; background: var(--tile-bg); border: 3px solid var(--bg); border-radius: 4px; box-shadow: inset 0 4px 0 var(--meter); padding: 14px 12px 8px; overflow: hidden; }
.name { font: 600 17px/1.25 "IBM Plex Sans"; }
.val { font: 600 22px/1.2 "Source Serif 4"; margin-top: 4px; }
.cap { position: absolute; left: 0; right: 0; bottom: 0; font-size: 16px; color: var(--ink-3); }
</style></head>
<body><div class="card">
  <div class="left">
    <p class="kicker">Independent · 2026-27 Budget</p>
    <h1>Federal Spending Explorer</h1>
    <p class="lede">Follow <b>$833bn</b> of Commonwealth spending down to programs, contracts and grants, and see how much of each is traced to a name.</p>
    <p class="url">spending.mchugh.au <span>Free · open data</span></p>
  </div>
  <div class="tm" id="tm"><p class="cap">2026-27 Budget expenses by function (Budget Paper No. 1)</p></div>
</div>
<script>
// 2026-27 Budget, BP1 expenses by function, $bn.
const data = [
  ["Social security and welfare", 308.7], ["Other purposes", 163.6], ["Health", 136.9],
  ["Education", 57.3], ["Defence", 52.1], ["General public services", 32.5],
  ["Transport and communication", 15.3], ["Fuel and energy", 15.2], ["Other economic affairs", 13.8],
  ["Housing and community amenities", 11.5], ["Public order and safety", 9.7], ["Recreation and culture", 6.3],
  ["Mining, manufacturing and construction", 5.6], ["Agriculture, forestry and fishing", 4.7],
];
const el = document.getElementById("tm");
const W = el.clientWidth, H = el.clientHeight - 38;
const total = data.reduce((s, d) => s + d[1], 0);
const items = data.map(([n, v]) => ({ n, v, a: v / total * W * H }));

function worst(row, side) {
  const s = row.reduce((t, r) => t + r.a, 0);
  let w = 0;
  for (const r of row) w = Math.max(w, side * side * r.a / (s * s), s * s / (side * side * r.a));
  return w;
}
let x = 0, y = 0, w = W, h = H, rest = items.slice();
while (rest.length) {
  const side = Math.min(w, h);
  let row = [rest.shift()];
  while (rest.length && worst([...row, rest[0]], side) <= worst(row, side)) row.push(rest.shift());
  const s = row.reduce((t, r) => t + r.a, 0);
  if (w >= h) {
    const rw = s / h; let yy = y;
    for (const r of row) { const rh = r.a / rw; place(r, x, yy, rw, rh); yy += rh; }
    x += rw; w -= rw;
  } else {
    const rh = s / w; let xx = x;
    for (const r of row) { const rw = r.a / rh; place(r, xx, y, rw, rh); xx += rw; }
    y += rh; h -= rh;
  }
}
function place(r, x, y, w, h) {
  const d = document.createElement("div");
  d.className = "tile";
  Object.assign(d.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
  if (w > 95 && h > 120) d.innerHTML = `<div class="name">${r.n}</div><div class="val">$${r.v.toFixed(1)}bn</div>`;
  el.appendChild(d);
}
</script>
</body></html>
